<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VALENCE" />
    <meta
      name="description"
      content="VALENCE: Your complete learning, networking, academic competition, marketplace and career ecosystem for ICAN, ATSWA, university, polytechnic and college students, and chartered accountants across Nigeria."
    />
    <link rel="icon" type="image/png" href="/valence-mark-sm.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>VALENCE | Vita sine litteris mors est.</title>
  </head>
  <body class="bg-[#0B0E11] text-[#F4F6F9] antialiased selection:bg-[#E0A82E]/25 selection:text-[#E0A82E]">
    <div id="root"></div>
    <script>
      (function () {
        function showError(msg, stack) {
          var d = document.getElementById('root');
          if (!d) return;
          d.innerHTML =
            '<div style="min-height:100vh;background:#0B0F14;color:#E4E9F0;font-family:Inter,system-ui,sans-serif;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
            '<div style="max-width:700px;width:100%;background:#11161C;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px">' +
            '<h1 style="color:#EA3943;font-size:20px;marginBottom:16px">VALENCE runtime error</h1>' +
            '<pre style="background:#0B0F14;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:16px;font-size:13px;color:#FF6B73;overflow-x:auto;white-space:pre-wrap;word-break:break-word">' +
            msg + (stack ? '\\n\\n' + stack : '') +
            '</pre></div></div>';
        }
        window.addEventListener('error', function (e) {
          showError(e.message || 'Error', e.error && e.error.stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          showError(
            (r && r.message) ? r.message : String(r),
            r && r.stack
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
